<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FS25 Manager - Administration</title>

<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<!-- ================= LOGIN ================= -->


<section id="loginPage">


<div class="loginBox">


<h1>
<i class="fa-solid fa-user-shield"></i>

Admin FS25

</h1>


<input 
type="text"
id="adminUsername"
placeholder="Identifiant">


<input 
type="password"
id="adminPassword"
placeholder="Mot de passe">


<button onclick="connectAdmin()">

Connexion

</button>


<p id="loginMessage"></p>


</div>


</section>





<!-- ================= ADMIN PANEL ================= -->


<section id="adminPanel" style="display:none;">



<header>


<div>

<h1>

<i class="fa-solid fa-tractor"></i>

FS25 Manager Admin

</h1>

</div>



<a href="../index.html">

Retour au site

</a>


</header>






<main>





<!-- DASHBOARD -->


<section class="dashboard">


<div class="stat">

<h3>Maps</h3>

<h1 id="totalMaps">
0
</h1>

</div>


<div class="stat">

<h3>Argent total</h3>

<h1 id="totalMoney">
0 €
</h1>

</div>


<div class="stat">

<h3>Champs</h3>

<h1 id="totalFields">
0
</h1>

</div>


</section>







<!-- GESTION MAP -->


<section class="panel">


<h2>

🗺️ Gestion des maps

</h2>



<button onclick="showAddMap()">

➕ Ajouter une map

</button>


<div id="mapsList">


</div>



</section>







<!-- FORMULAIRE MAP -->


<section class="panel" id="mapEditor">


<h2>

Modifier une map

</h2>



<input 
type="text"
id="mapName"
placeholder="Nom de la map">



<input 
type="file"
id="mapImage">



<input 
type="number"
id="mapMoney"
placeholder="Argent de départ">





<h3>
🎯 Objectifs
</h3>



<div class="checkboxGrid">


<label>
<input type="checkbox">
Élevage
</label>


<label>
<input type="checkbox">
Travaux agricoles
</label>


<label>
<input type="checkbox">
Sylviculture
</label>


<label>
<input type="checkbox">
Production
</label>


<label>
<input type="checkbox">
Carrière
</label>


<label>
<input type="checkbox">
Multijoueur
</label>


<label>
<input type="checkbox">
Solo
</label>


</div>







<h3>
🐄 Animaux
</h3>



<div class="checkboxGrid">


<label>
<input type="checkbox">
Vaches
</label>


<label>
<input type="checkbox">
Moutons
</label>


<label>
<input type="checkbox">
Poules
</label>


<label>
<input type="checkbox">
Cochons
</label>


<label>
<input type="checkbox">
Chevaux
</label>


</div>









<h3>
🌱 Cultures
</h3>



<div class="checkboxGrid">


<label>
<input type="checkbox">
Blé
</label>


<label>
<input type="checkbox">
Maïs
</label>


<label>
<input type="checkbox">
Orge
</label>


<label>
<input type="checkbox">
Colza
</label>


<label>
<input type="checkbox">
Tournesol
</label>


<label>
<input type="checkbox">
Betterave
</label>


</div>








<h3>
📝 Description
</h3>


<textarea
id="mapDescription"
placeholder="Description de la partie">
</textarea>






<button onclick="saveMap()">

💾 Enregistrer la map

</button>


</section>









<!-- PARAMETRES -->


<section class="panel">


<h2>

⚙️ Paramètres

</h2>


<button onclick="changeUsername()">

Modifier identifiant admin

</button>


<button onclick="changePassword()">

Modifier mot de passe admin

</button>



</section>







</main>


</section>





<script src="../js/storage.js"></script>

<script src="../js/admin.js"></script>


</body>

</html>
