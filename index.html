<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FS25 Manager</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">

        <img src="images/logo.png" alt="Logo">

        <div>

            <h1>FS25 Routier87</h1>

            <p>Gestionnaire de sauvegardes Farming Simulator 25</p>

        </div>

    </div>

    <div class="search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="searchInput"
            placeholder="Rechercher une map...">

    </div>

    <div class="headerButtons">

        <button id="themeButton">

            <i class="fa-solid fa-moon"></i>

        </button>

        <button id="adminButton">

            <i class="fa-solid fa-user-shield"></i>

        </button>

    </div>

</header>

<!-- ================= DASHBOARD ================= -->

<section class="dashboard">

    <div class="dashboardCard">

        <h3>🗺️ Maps</h3>

        <h1 id="nombreMaps">0</h1>

    </div>

    <div class="dashboardCard">

        <h3>💰 Argent total</h3>

        <h1 id="argentTotal">0 €</h1>

    </div>

    <div class="dashboardCard">

        <h3>🌾 Champs</h3>

        <h1 id="nombreChamps">0</h1>

    </div>

    <div class="dashboardCard">

        <h3>🐄 Animaux</h3>

        <h1 id="nombreAnimaux">0</h1>

    </div>

</section>

<!-- ================= LISTE DES MAPS ================= -->

<main>

    <h2>

        <i class="fa-solid fa-map"></i>

        Mes Maps

    </h2>

    <div id="mapsContainer" class="mapsContainer">

        <!-- Les cartes seront générées automatiquement -->

    </div>

</main>

<!-- ================= BOUTON AJOUT ================= -->

<button id="addMapButton">

    <i class="fa-solid fa-plus"></i>

</button>

<!-- ================= FOOTER ================= -->

<footer>

    <p>

        © 2026 FS25 Routier87

    </p>

</footer>

<script src="js/storage.js"></script>

<script src="js/app.js"></script>

</body>

</html>
